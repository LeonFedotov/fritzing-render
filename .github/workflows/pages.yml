# Builds the web demo (the renderer compiled to WebAssembly, the page in
# web/, and the parts index) and publishes it to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.2
  EMSDK_VERSION: 4.0.7   # the version Qt 6.11.2's WebAssembly build targets
  FRITZING_APP_REF: 5aa56a510183c23084990a6b4481708cad24c15b

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: fritzing-app sources and resources
        run: |
          mkdir ../fritzing-app && cd ../fritzing-app
          git init -q && git remote add origin https://github.com/fritzing/fritzing-app.git
          git sparse-checkout set --no-cone /src /resources
          git fetch -q --depth 1 --filter=blob:none origin "$FRITZING_APP_REF" && git checkout -q FETCH_HEAD
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libboost-dev libgl1-mesa-dev libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-${{ env.QT_VERSION }}-linux-wasm
      - name: Qt (desktop for the host tools and the parts index; WebAssembly)
        run: |
          pip install -q aqtinstall
          [ -d ~/qt/$QT_VERSION/gcc_64 ] || aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -O ~/qt
          [ -d ~/qt/$QT_VERSION/wasm_singlethread ] || aqt install-qt all_os wasm $QT_VERSION wasm_singlethread -O ~/qt
          chmod +x ~/qt/$QT_VERSION/wasm_singlethread/bin/* ~/qt/$QT_VERSION/wasm_singlethread/libexec/* || true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Parts libraries
        run: scripts/fetch-vendor.sh
      - name: CLI (makes the parts index)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$HOME/qt/$QT_VERSION/gcc_64 -DFRITZING_APP=$PWD/../fritzing-app -DQT_NO_PRIVATE_MODULE_WARNING=ON
          cmake --build build -j"$(nproc)" --target fritzing-render
      - name: WebAssembly renderer
        run: |
          mkdir -p build-wasm/boost-include && ln -sfn /usr/include/boost build-wasm/boost-include/boost
          ~/qt/$QT_VERSION/wasm_singlethread/bin/qt-cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=$HOME/qt/$QT_VERSION/gcc_64 -DFR_BOOST_INCLUDE=$PWD/build-wasm/boost-include \
            -DFRITZING_APP=$PWD/../fritzing-app -DQT_NO_PRIVATE_MODULE_WARNING=ON
          cmake --build build-wasm -j"$(nproc)"
      - name: Site
        run: QT_QPA_PLATFORM=offscreen python3 scripts/build-site.py --fritzing-app ../fritzing-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
