 <rect x='0' y='0' width='400' height='200' fill='#123456'/>
 <g id='breadboard'>
  <rect id='connector0pin' x='40' y='150' width='20' height='20' fill='#888888'/>
  <rect id='connector1pin' x='340' y='150' width='20' height='20' fill='#888888'/>
  <rect id='connector1terminal' x='345' y='195' width='10' height='5' fill='#888888'/>
 </g>
</svg>
